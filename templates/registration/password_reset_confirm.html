{% extends 'base.html' %}{% block content %}<section class="auth-page wrap"><div class="auth-card"><span class="eyebrow">Account / New password</span><h1>Set a fresh <em>password.</em></h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="button button--orange" type="submit">Update password <span>↗</span></button></form>{% else %}<p>This reset link is no longer valid. Request a new one.</p><a class="button button--orange" href="{% url 'password_reset' %}">Request a new link</a>{% endif %}</div></section>{% endblock %}
