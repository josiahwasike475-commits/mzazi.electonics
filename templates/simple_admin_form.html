{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · Simple Admin</title><link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml"><link rel="stylesheet" href="{% static 'css/simple-admin.css' %}"><link rel="stylesheet" href="{% static 'css/fresh-redesign.css' %}"></head><body class="simple-admin"><header class="simple-head"><a href="{% url 'dashboard:simple_admin' %}"><img src="{% static 'images/logo.svg' %}" alt="Mzazi Electronics"></a><div><strong>Simple Admin</strong><small>Easy add form</small></div><a class="simple-link" href="{% url 'dashboard:simple_admin' %}">← Back</a></header><main class="simple-form-wrap"><div class="simple-form-card"><span class="simple-kicker">Mzazi / Simple Admin</span><h1>{{ title }}</h1><p>{{ help_text }}</p><form method="post">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{% if field.field.required %} <i>*</i>{% endif %}{{ field }}{% for error in field.errors %}<small class="simple-error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="simple-submit" type="submit">Save {{ object_name }} ✓</button></form></div></main></body></html>
