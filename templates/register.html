{% extends 'base.html' %}
{% block content %}
<section class="auth-page wrap"><div class="auth-card"><span class="eyebrow">Account / Create yours</span><h1>Keep your essentials <em>in one place.</em></h1><p>Save delivery details and keep track of your Mzazi orders.</p><form method="post">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.errors %}<small class="error-text">{{ field.errors|striptags }}</small>{% endif %}</label>{% endfor %}<button class="button button--orange" type="submit">Create account <span>↗</span></button></form></div></section>
{% endblock %}
